  const port=[...new Set(I.rows.map(r=>r.portador).filter(Boolean))];
  const ok=R.ok.length, dif=R.dif.length, novo=R.novo.length, falt=R.falt.length;
  const totPdf=I.total, totPrev=sum(R.prev,x=>x.valor);
  const totDepois=r2(sum(R.ok,m=>m.r.valor)+sum(R.dif.filter(m=>m.usar),m=>m.r.valor)+sum(R.dif.filter(m=>!m.usar),m=>m.e.valor)+sum(R.novo.filter(r=>r.on),r=>r.valor)+sum(R.falt.filter(f=>f.acao==='manter'),f=>f.e.valor));
  const rowsLidos=r2(sum(I.rows.filter(r=>r.tipo!=='pagamento'),r=>r.valor));
  const base=I.compras!=null?I.compras:totPdf; const adiant=I.compras!=null&&totPdf!=null?r2(I.compras-totPdf):0; I.adiantado=adiant>0.05?adiant:0;
  let falta=base!=null?r2(base-totDepois):0; if(Math.abs(falta)<=0.05) falta=0; I.falta=falta; I.totDepois=totDepois;
  let totMsg=''; I.adiList=[];
  if(base!=null){ const d=r2(base-rowsLidos), rot=I.compras!=null?'o total de compras da fatura':'o total da fatura';
    totMsg=Math.abs(d)<=0.05?`<div class="hint small" style="background:var(--accent-soft)">✓ As compras lidas somam ${rot}: <b>${brl(base)}</b>${Math.abs(d)>=0.005?` (diferença de ${brl(Math.abs(d))} de arredondamento do banco)`:''}.</div>`
    :d>0?`<div class="hint small">${cap(rot)} é <b>${brl(base)}</b>, mas as compras que o app conseguiu ler somam <b>${brl(rowsLidos)}</b>. Faltaram <b>${brl(d)}</b>: pode ser juros ou linhas que o app não entendeu.</div>`
    :`<div class="hint small">O app leu <b>${brl(-d)}</b> a mais que ${rot} (${brl(base)}). Confira se há crédito ou estorno que não foi lido, ou uma linha repetida.</div>`;
    if(I.adiantado){ const ant=(String(I.text||'').match(/fatura anterior[^0-9\n]{0,15}(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})/i)||[])[1]; const vAnt=ant?parseBRL(ant):null;
      const pg=(I.rows||[]).filter(r=>r.tipo==='pagamento').map(r=>({d:r.data,v:Math.abs(r.valor)})); let usadoAnt=false; const adi=pg.filter(x=>{ if(!usadoAnt&&vAnt!=null&&Math.abs(x.v-vAnt)<0.01){ usadoAnt=true; return false; } return true; });
      const bate=Math.abs(sum(adi,x=>x.v)-I.adiantado)<0.05; I.adiList=bate&&adi.length?adi.map(x=>({d:x.d||'',v:x.v})):[{d:'',v:I.adiantado}];
      totMsg+=`<div class="hint small grid" style="gap:4px"><b>Conta da fatura</b>
        <span>Compras do período: <b>${brl(I.compras)}</b></span>
        <span>− Pagamentos feitos antes do fechamento: <b>${brl(I.adiantado)}</b>${bate&&adi.length?` (${adi.map(x=>esc(x.d)+' '+brl(x.v)).join(' · ')})`:''}</span>
        <span>= Falta pagar: <b>${brl(totPdf)}</b> ${Math.abs(r2(I.compras-I.adiantado)-totPdf)<0.05?'✓ igual à fatura':''}</span>
        ${vAnt!=null&&usadoAnt?`<span class="muted">O pagamento de ${brl(vAnt)} quitou a fatura anterior e não entra nesta conta.</span>`:''}</div>`; }
    else if(I.compras!=null&&totPdf!=null&&totPdf-I.compras>0.05) totMsg+=`<div class="hint small">A fatura cobra ${brl(r2(totPdf-I.compras))} além das compras do mês (saldo da fatura anterior ou encargos).</div>`; }
  else totMsg=`<div class="hint small">Não achei o total impresso na fatura. Confira com o valor que o banco cobra: as compras lidas somam ${brl(rowsLidos)}.</div>`;
  if(I.adiantado){ const pg=(I.rows||[]).filter(r=>r.tipo==='pagamento'&&/^\d{2}\/\d{2}/.test(r.data||'')); const ms=pg.map(r=>{ const mm=+r.data.slice(3,5); let y=+I.mes.slice(0,4); if(mm>+I.mes.slice(5)) y--; return y+'-'+String(mm).padStart(2,'0'); }).sort(); I.mesAdiant=ms[ms.length-1]||addM(I.mes,-1); if(!I.adiList.length) I.adiList=[{d:'',v:I.adiantado}]; }
  const fixosCard=calc(I.mes).des.filter(d=>d.cartao===I.card&&d.cardNome).map(d=>({...d,v:d.estimado}));
  return `<section class="card grid">
    <div class="sechead"><h2>Conferência da fatura</h2><span class="muted small">${I.how==='claude'?'lido pelo Claude':'leitura automática'}</span></div>
    ${cardPickImp(I,opts)}
    <p class="small muted" style="margin:0">O PDF não fica salvo. ${I.limpos?`${I.limpos} dado(s) pessoal(is) (CPF, cartão, e-mail, telefone) foram removidos do texto lido.`:'Nenhum dado pessoal encontrado no texto lido.'}</p>
    <div class="frow">
      <label class="f">Fatura de (mês do vencimento)<input class="i" type="month" id="impMes" value="${esc(I.mes)}"></label>
    </div>
    ${I.passada?`<div class="hint grid" style="gap:8px"><b>Esta fatura venceu em ${esc(mLabel(I.mes))}, e hoje é ${esc(mLabel(ymNow()))}.</b>
      <label class="check"><input type="radio" name="modoImp" value="historico" ${I.modo!=='previsao'?'checked':''}> Guardar como fatura de ${esc(MESES[+I.mes.slice(5)-1])}. As parcelas continuam sozinhas nos meses seguintes.</label>
      <label class="check"><input type="radio" name="modoImp" value="previsao" ${prevMode?'checked':''}> Usar só para prever os próximos meses: trazer apenas as parcelas que continuam (${R.novo.filter(r=>r.k&&r.n&&r.k<r.n).length}).</label></div>`:''}
    ${!I.mesAuto?`<div class="hint small">${I.mesEstimado?`A fatura não traz a data de vencimento. Pelas datas das compras, deve ser a fatura de <b>${esc(mLabel(I.mes))}</b>. Confira o mês acima antes de aplicar.`:'Não encontrei a data de vencimento no arquivo. Confira o mês da fatura acima antes de aplicar.'}</div>`:''}
    ${totMsg}${I.how!=='claude'&&S.caps.sample&&I.text?`<div><button class="btn" data-act="claudeparse">Ler de novo com Claude</button></div>`:''}
    <div class="minis">
      <div class="mini"><div class="eyebrow">${I.compras!=null?'Compras na fatura':'Total da fatura'}</div><div class="v">${base!=null?brl(base):'—'}</div><div class="small muted">${I.adiantado?'a pagar '+brl(totPdf):'impresso no PDF'}</div></div>
      <div class="mini"><div class="eyebrow">Compras lidas</div><div class="v">${brl(rowsLidos)}</div><div class="small muted">${I.rows.filter(r=>r.tipo!=='pagamento').length} linhas</div></div>
      <div class="mini"><div class="eyebrow">Já previsto no app</div><div class="v">${brl(totPrev)}</div><div class="small muted">${R.prev.length} ${R.prev.length===1?"item":"itens"} (parcelas e compras lançadas)</div></div>
      <div class="mini"><div class="eyebrow">Bateram</div><div class="v" style="color:var(--in)">${ok}</div></div>
      <div class="mini"><div class="eyebrow">Para revisar</div><div class="v" style="color:var(--warn)">${dif+novo+falt}</div></div>
    </div>
    ${port.length>1?`<div class="grid"><div class="eyebrow">Portadores na fatura (cartões adicionais)</div><div class="frow">${port.map(p=>`<label class="f">${esc(p)}<select class="i" data-port="${esc(p)}">${quemOpts(I.portMap[p]||'')}</select></label>`).join('')}</div></div>`:''}
    ${sec('Na fatura, mas você não lançou','','warn',`<p class="small muted" style="margin:4px 0">Confira se reconhece cada compra. Desmarque o que não quer lançar e use "Não reconheço" para marcar possível compra indevida.</p>`+R.novo.map((r,i)=>`<div class="cr"><input type="checkbox" data-nv="${i}" data-f="on" ${r.on?'checked':''} aria-label="Lançar ${esc(r.desc)}"><span><b>${esc(r.desc)}</b></span><span class="v">${brl(r.valor)}</span>
      <div class="meta">${esc(r.data||'')} <input class="i pc" data-nv="${i}" data-f="k" value="${esc(r.k||'')}" placeholder="–" inputmode="numeric" aria-label="Parcela atual"> de <input class="i pc" data-nv="${i}" data-f="n" value="${esc(r.n||'')}" placeholder="–" inputmode="numeric" aria-label="Total de parcelas">
      <select class="i" data-nv="${i}" data-f="quem" aria-label="Dono">${quemOpts(r.quem)}</select><select class="i" data-nv="${i}" data-f="cat" aria-label="Categoria">${catOpts(r.cat)}</select>
      ${fixosDoCartao(I.card).length?`<select class="i" data-nv="${i}" data-f="fixo" aria-label="Faz parte de uma conta fixa?"><option value="" ${!r.fixo?'selected':''}>${(()=>{const f=fixosDoCartao(I.card).find(l=>catOf(l)===r.cat);return f?'Dentro do fixo: '+esc(f.desc)+' (auto)':'Fora das contas fixas'})()}</option>${fixosDoCartao(I.card).map(l=>`<option value="${esc(l.id)}" ${r.fixo===l.id?'selected':''}>Dentro do fixo: ${esc(l.desc)}</option>`).join('')}<option value="-" ${r.fixo==='-'?'selected':''}>Compra à parte</option></select>`:''}<label class="check small"><input type="checkbox" data-nv="${i}" data-f="suspeita" ${r.suspeita?'checked':''}> Não reconheço</label>${r.tipo!=='compra'?`<span class="chip">${esc(r.tipo)}</span>`:''}</div></div>`).join(''),novo)}
    ${sec('Valores diferentes','','warn',R.dif.map((m,i)=>`<div class="cr"><input type="checkbox" data-df="${i}" ${m.usar?'checked':''} aria-label="Usar valor da fatura para ${esc(m.e.desc)}"><span><b>${esc(m.e.desc)}</b> <span class="small muted">→ na fatura: ${esc(m.r.desc)}</span></span><span class="v">${brl(m.r.valor)}</span>
      <div class="meta">Previsto ${brl(m.e.valor)} · diferença ${brl(m.r.valor-m.e.valor)} · marque para corrigir com o valor da fatura${m.e.nTotal>1?' (vale para as próximas parcelas)':''}</div></div>`).join(''),dif)}
    ${sec('Você lançou, mas não veio na fatura','','bad',`<p class="small muted" style="margin:4px 0">Pode ser compra em outro cartão, cobrança que vai para o mês seguinte, parcela paga adiantada ou compra cancelada.</p>`+R.falt.map((f,i)=>`<div class="cr"><span></span><span><b>${esc(f.e.desc)}</b> <span class="small muted">${f.e.origem==='total'?'lançado antes só com o total; será trocado pelas compras desta fatura':f.e.nTotal>1?f.e.k+'/'+f.e.nTotal:f.e.recorrente?'todo mês':'à vista'}</span></span><span class="v">${brl(f.e.valor)}</span>
      <div class="meta"><select class="i" data-ft="${i}" aria-label="O que fazer com ${esc(f.e.desc)}" style="max-width:240px">${[['manter','Manter como está'],['proximo','Passar para o mês seguinte'],['antecipada','Foi paga adiantada (mês anterior)'],['apagar',f.e.nTotal>1?'Apagar a compra toda':'Apagar']].filter(o=>o[0]!=='antecipada'||f.e.nTotal>1).map(([v,l])=>`<option value="${v}" ${f.acao===v?'selected':''}>${l}</option>`).join('')}</select></div></div>`).join(''),falt)}
    ${sec('Bateram','','ok',R.ok.map(m=>`<div class="cr"><span>✓</span><span>${esc(m.e.desc)}${m.nome?` <span class="small muted">(na fatura: ${esc(m.r.desc)})</span>`:''}</span><span class="v">${brl(m.r.valor)}</span></div>`).join(''),ok,true)}
    ${sec('Não entram nesta fatura','','',`<p class="small muted" style="margin:4px 0">Pagamento da fatura anterior: ele quita o mês passado, não é gasto deste mês.</p>`+R.pag.map(r=>`<div class="cr"><span></span><span>${esc(r.desc)}</span><span class="v">${brl(Math.abs(r.valor))}</span></div>`).join(''),R.pag.length,true)}
    ${fixosCard.length&&!prevMode?`<div class="hint small">${fixosCard.map(d=>`<b>${esc(d.desc)}</b> (${brl(d.v)})`).join(', ')} ${fixosCard.length>1?'são estimativas':'é uma estimativa'} de conta fixa paga com este cartão. Depois de aplicar, essa estimativa sai do mês e vale o que veio na fatura.</div>`:''}
    ${!I.rows.length?`<div class="err">Não encontrei lançamentos neste arquivo.${totPdf!=null?' Mas achei o total da fatura: você pode lançar só ele.':''}</div>`:''}
    ${!prevMode&&base!=null&&falta>0.009?`<label class="check"><input type="checkbox" id="impFalta" ${I.lancFalta!==false?'checked':''}> Lançar <b>${brl(falta)}</b> como "valor não detalhado" para o cartão ficar igual à fatura</label>`:''}
    ${!prevMode&&I.adiantado?`<div class="hint small grid" style="gap:10px"><span>Esta fatura teve <b>${brl(I.adiantado)}</b> pagos antes do fechamento${I.adiList.length>1?`, em ${I.adiList.length} pagamentos`:''}. Eles abatem a fatura, que fica em <b>${brl(totPdf)}</b>. Diga quem pagou cada um:</span>
      ${I.adiList.map((a,i)=>{ const sel=adiSel(I,i), ant=addM(I.mes,-1), meses=[...new Set([sel.mes0,ant,I.mes].filter(Boolean))], pess=cfg().pessoas||[];
        return `<div class="grid" style="gap:6px;background:var(--surface);border-radius:10px;padding:10px;color:var(--ink)"><b>${a.d?'Pagamento de '+esc(a.d):'Pagamento adiantado'}: ${brl(a.v)}</b>
        <div class="seg" role="group" aria-label="Quem pagou"><button type="button" data-act="adiq" data-i="${i}" data-v="eu" aria-pressed="${sel.q==='eu'}">Eu paguei</button><button type="button" data-act="adiq" data-i="${i}" data-v="outro" aria-pressed="${sel.q==='outro'}">Outra pessoa pagou</button></div>
        ${sel.q==='eu'?`<label class="f">Sai do meu saldo em<select class="i" data-adimes="${i}">${meses.map(m=>`<option value="${esc(m)}" ${m===sel.mes?'selected':''}>${esc(cap(mLabel(m)))}${m===I.mes?' (mês desta fatura)':m===ant?' (mês anterior)':''}</option>`).join('')}</select></label>`
        :`<label class="f">Quem pagou? (opcional)<select class="i" data-adip="${i}"><option value="">Não sei / não importa</option>${pess.map(p=>`<option ${p===sel.p?'selected':''}>${esc(p)}</option>`).join('')}</select></label>
          <span class="small muted">Não sai do seu saldo.${sel.p?` Abate do que ${esc(sel.p)} tem a pagar, para você não cobrar duas vezes.`:' Só abate a fatura.'}</span>`}</div>`; }).join('')}</div>`:''}
    <div class="revbar"><span class="num small">Depois de aplicar, o cartão fica com <b>${brl(r2(totDepois+(!prevMode&&falta>0.009&&I.lancFalta!==false?falta:0)-(!prevMode?I.adiantado||0:0)))}</b>${base!=null?` · fatura ${brl(I.adiantado?totPdf:base)}`:''}</span><span style="margin-left:auto" class="btnrow"><button class="btn" data-act="impreset">Cancelar</button><button class="btn pri" data-act="impdo" ${I.cardOk?'':'disabled title="Confirme o cartão no topo"'}>${!I.cardOk?'Confirme o cartão no topo':prevMode?'Trazer parcelas':S.conf[I.card+'_'+I.mes]&&!S.conf[I.card+'_'+I.mes].previsao?'Aplicar mesmo assim':'Aplicar conferência'}</button></span></div>
  </section>`;
}

/* ---------- Ajustes ---------- */
const pct1=x=>Math.round((+x||0)*10)/10;
const metaTotal=C=>pct1(sum(C.grupos,g=>+g.meta||0));
const grupoSobra=C=>C.grupos.find(g=>g.nome==='Margem extra')||C.grupos[C.grupos.length-1];
function metaInfoHtml(C,aviso){
  const t=metaTotal(C), f=pct1(100-t), fmt=x=>String(x).replace('.',',');
  if(Math.abs(f)<0.05) return `<b style="color:var(--in)">Soma: 100% ✓</b>`;
  if(f>0) return `<b style="color:var(--warn)">Soma: ${fmt(t)}% · faltam ${fmt(f)}%</b>${C.grupos.length?` <button class="btn ghost" style="padding:4px 8px" data-act="metafill">Pôr ${fmt(f)}% em ${esc(grupoSobra(C).nome)}</button>`:''}${aviso?`<br>${esc(aviso)}`:''}`;
  return `<b style="color:var(--out)">Soma: ${fmt(t)}% · passou ${fmt(-f)}%</b> <span class="muted">diminua algum grupo</span>`;
}
function viewAjustes(){
  if(!S.draftDirty||!S.draftCfg) S.draftCfg=clone(cfg());
  const C=S.draftCfg, base=calc(S.mes).totEnt, p=prefs();
  const metaSum=sum(C.grupos,g=>+g.meta||0);
  const rec=S.lanc.filter(l=>l.recorrente&&(!l.fim||diffM(ymNow(),l.fim)>=0)).sort((a,b)=>(a.tipo>b.tipo?1:-1)||b.valor-a.valor);
  const recSub=S.compras.filter(c=>c.recorrente&&(!c.fim||diffM(ymNow(),c.fim)>=0));
  const open=k=>(S.openSet||'plano')===k?'open':'';
  const lb=p.lastBackup;
  return `<div class="grid">
  <details class="set" ${open('plano')} data-sec="plano"><summary>Seu plano <span class="small muted">quanto de cada entrada vai para cada grupo</span></summary><div class="body">
    <p class="small muted" style="margin:0"><b>100% é tudo o que entrou no mês</b>: salário e rendas extras, como férias, 13º e bônus. Divida esses 100% entre os grupos; a soma precisa fechar em 100%. No mês, o app avisa quando um gasto passa do limite do grupo. Exemplo com ${esc(mLabel(S.mes))}: 100% = ${brl(base)}.</p>
    <div>${C.grupos.map((g,i)=>`<div class="pl"><div class="plh"><input class="i" data-cfg="grupos.${i}.nome" value="${esc(g.nome)}" aria-label="Nome do grupo"><label class="check small"><input type="checkbox" data-cfgb="grupos.${i}.poupanca" ${g.poupanca?'checked':''}> é poupança</label><button class="btn danger" data-act="cfgdel" data-k="grupos" data-i="${i}" aria-label="Remover grupo ${esc(g.nome)}">×</button></div>
      <div class="plr"><input type="range" min="0" max="100" step="1" value="${esc(+g.meta||0)}" data-meta="${i}" aria-label="Percentual de ${esc(g.nome)}"><input class="i num pct" data-meta="${i}" value="${esc(+g.meta||0)}" inputmode="decimal" aria-label="Percentual de ${esc(g.nome)} digitado"><span class="rs" data-rs="${i}">${brl(base*(+g.meta||0)/100)}</span></div></div>`).join('')}</div>
    <div class="btnrow" style="align-items:center"><button class="btn" data-act="cfgadd" data-k="grupos">+ Grupo</button><span id="metaInfo" class="small" aria-live="polite">${metaInfoHtml(C)}</span></div>
    <p class="small muted" style="margin:0">"É poupança": investimento e amortização somam juntos. Num mês em que amortizar o financiamento, o plano considera a meta cumprida pela amortização.</p>
    <label class="f">Quanto você já tem investido hoje (para o acumulado)<input class="i num" data-cfg="investInicial" value="${esc(C.investInicial||0)}" inputmode="numeric" data-money placeholder="R$ 0,00"></label>
    <div class="eyebrow">Reserva de emergência</div>
    <div class="frow"><label class="f">Quanto você já tem guardado na reserva hoje<input class="i num" data-cfg="reserva.atual" value="${esc(C.reserva?.atual||0)}" inputmode="numeric" data-money placeholder="R$ 0,00"></label>
    <label class="f">Meta: quantos meses de gastos guardar<input class="i num" data-cfg="reserva.meses" value="${esc(C.reserva?.meses||6)}" inputmode="numeric"></label></div>
    <p class="small muted" style="margin:0">Os aportes do mês entram pela categoria "Reserva de emergência". O comum é guardar de 3 a 12 meses de gastos.</p>
  </div></details>
  <details class="set" ${open('fixos')} data-sec="fixos"><summary>Salário e contas fixas <span class="small muted">${rec.length} ${rec.length===1?'item':'itens'}</span></summary><div class="body">
    <p class="small muted" style="margin:0">Aparecem automaticamente todo mês. Se em algum mês o valor for diferente, abra o mês e ajuste só ele.</p>
    <div class="btnrow"><button class="btn pri" data-act="novofixo" data-t="entrada">+ Entrada fixa (salário)</button><button class="btn" data-act="novofixo" data-t="despesa">+ Conta fixa</button><button class="btn" data-act="novofin">+ Financiamento (casa, carro)</button></div>
    <div class="rows">${rec.map(l=>`<button class="row" data-act="editlanc" data-id="${esc(l.id)}"><span class="d">${esc(l.desc)}</span><span class="v" style="color:${l.tipo==='entrada'?'var(--in)':'var(--ink)'}">${l.tipo==='entrada'?'+':''}${brl(l.valor)}</span><span class="sub"><span class="chip">${l.tipo==='entrada'?'entrada':esc(l.grupo||'sem grupo')}</span>${l.cartao?`<span class="chip third">no cartão ${esc(cardName(l.cartao))}</span>`:''}<span>desde ${mShort(l.mes)}${l.fim?' até '+mShort(l.fim):''}</span></span></button>`).join('')||'<div class="empty">Nada cadastrado ainda.</div>'}</div>
    ${(()=>{ const fins=S.ativos.filter(a=>a.classe==='divida'&&+a.parcela>0); return fins.length?`<div class="eyebrow">Financiamentos e empréstimos</div><div class="rows">${fins.map(a=>{const f=restParc(a,ymNow());return `<button class="row" data-act="ativoedit" data-id="${esc(a.id)}"><span class="d">${esc(a.nome||a.tipo)}</span><span class="v">${brl(a.parcela)}</span><span class="sub"><span class="chip">financiamento</span><span class="chip">${f?'faltam '+f+' parcelas':'parcelas não informadas'}</span>${a.dia?`<span class="chip">dia ${esc(a.dia)}</span>`:''}</span></button>`}).join('')}</div><p class="small muted" style="margin:0">A parcela entra sozinha todo mês nas contas. A dívida aparece em Patrimônio, descontada do que você tem.</p>`:''; })()}

function driveUI(){
  if(location.protocol!=='https:') return `<p class="small muted" style="margin:0">Para o backup ir sozinho para o Google Drive, o app precisa estar publicado num endereço https (por exemplo, GitHub Pages), porque o Google não aceita login a partir de um arquivo aberto no celular. Enquanto isso, use "Enviar para Drive / Gmail": abre o compartilhamento do Android e você escolhe o Drive.</p>`;
  const C=S.draftCfg||cfg(), on=prefs().driveOn;
  return `<label class="f">ID do cliente OAuth do Google (termina em .apps.googleusercontent.com)<input class="i" data-cfg="driveClientId" value="${esc(C.driveClientId||'')}" autocomplete="off"></label>
  <div class="btnrow"><button class="btn ${on?'':'pri'}" data-act="driveconnect" ${C.driveClientId?'':'disabled'}>${on?'Reconectar':'Conectar Google Drive'}</button>${on?'<button class="btn" data-act="drivetest">Enviar backup agora</button><button class="btn danger" data-act="driveoff">Desligar</button>':''}</div>
  <p class="small muted" style="margin:0">${on?'Ligado: o backup mensal vai para a pasta "Saldo Certo - backups" no seu Drive.':'O app só consegue ver os arquivos que ele mesmo criou no seu Drive.'}</p>`;
}
function restoreBox(){
  const R=S.restore;
  if(R.cifrado) return `<div class="confirm"><b>Backup criptografado de ${esc(R.exportado?new Date(R.exportado).toLocaleString('pt-BR'):'data desconhecida')}</b><label class="f">Senha usada quando o backup foi feito (ou o código de recuperação)<input class="i" type="password" id="restorePw" autocomplete="off"></label>${R.err?`<div class="err">${esc(R.err)}</div>`:''}<div class="btnrow"><button class="btn pri" data-act="restoreunlock">Abrir backup</button><button class="btn" data-act="restorecancel">Cancelar</button></div></div>`;
  return `<div class="confirm"><b>Restaurar ${R.lanc.length} lançamentos e ${R.compras.length} compras?</b><span class="small">Itens com o mesmo código serão substituídos. Os demais continuam.</span><div class="btnrow"><button class="btn pri" data-act="restoredo">Restaurar</button><button class="btn" data-act="restorecancel">Cancelar</button></div></div>`;
}

async function lerBytes(file){ // lê o arquivo inteiro antes de qualquer outra coisa; tenta de novo por outro caminho se vier vazio

const ERRO_VAZIO='O celular entregou o arquivo vazio (0 bytes). Isso costuma acontecer quando o PDF está no WhatsApp, Gmail ou Drive e ainda não foi baixado. Abra o PDF, toque em Baixar ou Salvar no aparelho e escolha de novo pela pasta Downloads.';
async function handleFile(file){

  const bytes=ehPdf?await lerBytes(file):null;

  if(ehPdf){ const h=new Uint8Array(bytes.slice(0,1024)); let ok=false; for(let i=0;i<h.length-4;i++) if(h[i]===37&&h[i+1]===80&&h[i+2]===68&&h[i+3]===70){ ok=true; break; } if(!ok){ S.imp={stage:'pick',err:'Este arquivo não parece ser um PDF (talvez seja um atalho ou uma página da web salva). Baixe a fatura em PDF no app do banco e tente de novo.'}; render(); return; } }
  S.imp={stage:'busy',msg:'Abrindo '+name+'…',fileName:name,card:S.impCard||S.card,cardOk:!!S.impCard}; S.impCard=null; render();

  }catch(e){ const m=String(e&&e.message||e); S.imp={stage:'pick',err:/empty|zero bytes/i.test(m)?ERRO_VAZIO:/Invalid PDF|corrupt|structure/i.test(m)?'O PDF parece estar danificado ou incompleto. Baixe a fatura de novo no app do banco.':'Não consegui ler o arquivo: '+m}; render(); }
  const fi=document.getElementById('impFile'); if(fi) fi.value='';
}
function b64url(b,type){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type}))}

async function pdfText(pdf){
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent(); const rows=[];
    for(const it of tc.items){ if(!it.str||!it.str.trim()) continue; const y=it.transform[5], x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<2.5); if(!r){r={y,items:[]};rows.push(r)} r.items.push({x,s:it.str,w:it.width||0}); }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); let s='',end=null; for(const it of r.items){ if(end!=null) s+=(it.x-end>30?'   ':(it.x-end>1.5?' ':'')); s+=it.s; end=it.x+it.w; } lines.push(s); }
    lines.push('\f');
  }
  return lines.join('\n');
}
const CLAUDE_PROMPT=`Você vai ler uma fatura de cartão de crédito brasileira e extrair os lançamentos.
Inclua TODOS os lançamentos desta fatura: compras à vista, parcelas de compras parceladas, estornos, créditos, pagamentos, IOF, juros, anuidade e tarifas.
NÃO inclua: linhas de total ou subtotal, limites, resumo, opções de parcelamento da fatura, nem o quadro de "próximas faturas" / "compras parceladas a vencer".
Responda apenas com JSON neste formato:
{"vencimento":"AAAA-MM-DD ou null","total":1234.56,"lancamentos":[{"data":"DD/MM","descricao":"nome como aparece, sem o texto da parcela","parcela":3,"parcelas":10,"valor":51.43,"tipo":"compra","portador":null}]}
Regras: "tipo" é compra, estorno, pagamento ou encargo. "valor" é positivo para compras e encargos, negativo para estornos, créditos e pagamentos. "parcela" e "parcelas" são null para compras à vista. Use ponto como separador decimal. "portador" é o nome ou final do cartão quando a fatura separa os lançamentos por titular/adicional; senão null. "total" é o valor total desta fatura.`;
function fromClaude(j){
  const arr=Array.isArray(j)?j:(j&&Array.isArray(j.lancamentos)?j.lancamentos:[]);
  const rows=arr.map(x=>{let v=+x.valor;if(isNaN(v))v=parseBRL(x.valor);const sp=splitParcela(String(x.descricao||''));const k=+x.parcela||sp.k||null,n=+x.parcelas||sp.n||null;

    return {data:normData(x.data),desc:(sp.desc||String(x.descricao||'')).slice(0,200),k:k&&n&&k<=n?k:null,n:k&&n&&k<=n?n:null,valor:r2(v),tipo,portador:x.portador?String(x.portador).slice(0,40):''}}).filter(r=>!isNaN(r.valor));

/* ---------- remove dados pessoais do texto antes de usar ---------- */
function limparDadosPessoais(t){
  let n=0; const rep=(re,r)=>{ t=t.replace(re,()=>{n++;return r}); };
  rep(/\b\d{3}\.\d{3}\.\d{3}-\d{2}\b/g,'[CPF]');
  rep(/\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b/g,'[CNPJ]');
  rep(/\b(?:\d{4}[ .\-]?){3}\d{4}\b/g,'[CARTÃO]');
  rep(/\b\d{4}[ .\-]?(?:[*Xx•]{4}[ .\-]?){2}\d{4}\b/g,'[CARTÃO]');
  rep(/[\w.+-]+@[\w-]+\.[\w.-]+/g,'[E-MAIL]');
  rep(/\(?\b\d{2}\)?\s?9\d{4}-\d{4}\b/g,'[TELEFONE]');
  rep(/\bCEP:?\s*\d{5}-?\d{3}\b/gi,'[CEP]');
  return {t,n};
}
/* ===================== conferência (conciliação) ===================== */
const toks=s=>normDesc(s).split(' ').filter(t=>t.length>=3&&!/^\d+$/.test(t));
function simDesc(a,b){ const na=normDesc(a), nb=normDesc(b); if(!na||!nb) return 0; if(na===nb) return 1; if(na.slice(0,5)===nb.slice(0,5)) return .8; const ta=toks(a), tb=toks(b); if(!ta.length||!tb.length) return 0; const sh=ta.filter(t=>tb.some(u=>u===t||(t.length>=4&&u.startsWith(t))||(u.length>=4&&t.startsWith(u)))).length; return sh/Math.min(ta.length,tb.length)*.75; }
function conciliar(rows,card,M){
  const prev=comprasDoMes(M,card); const usado=new Set();
  const ok=[],dif=[],novo=[],pag=[];
  const fat=rows.filter(r=>{ if(r.tipo==='pagamento'){ pag.push(r); return false } return true; });
  const pairs=[];
  fat.forEach((r,ri)=>prev.forEach((e,ei)=>{ if(e.origem==='total'||e.origem==='adiantado') return;
    const s=simDesc(r.desc,e.desc); const veq=Math.abs((+e.valor)-r.valor)<0.011;
    const parcOk=!(r.n&&+e.nTotal>1&&e.origem!=='planilha')||(r.k===e.k&&r.n===+e.nTotal);
    let score=0;
    if(veq&&s>=.4&&parcOk) score=3+s; else if(veq&&parcOk&&s<.4) score=2+s; else if(!veq&&s>=.55&&parcOk) score=1+s;
    if(score) pairs.push({ri,ei,score,veq,s});
  }));
  pairs.sort((a,b)=>b.score-a.score);
  const rUsed=new Set();
  for(const p of pairs){ if(rUsed.has(p.ri)||usado.has(p.ei)) continue;
    const r=fat[p.ri], e=prev[p.ei];
    if(p.score>=2&&p.score<3){ // valor igual, nome diferente: só aceita se não houver outro previsto com o mesmo valor
      const same=prev.filter((x,i)=>!usado.has(i)&&Math.abs(x.valor-r.valor)<0.011).length; if(same>1) continue; }
    rUsed.add(p.ri); usado.add(p.ei);
    if(p.veq) ok.push({r,e,nome:p.s<.4}); else dif.push({r,e,usar:true});
  }
  fat.forEach((r,ri)=>{ if(!rUsed.has(ri)) novo.push(r); });
  const falt=prev.filter((e,i)=>!usado.has(i)).map(e=>({e,acao:e.origem==='total'||e.origem==='adiantado'?'apagar':'manter'}));
  return {prev,ok,dif,novo,falt,pag};
}
function toReview(rows,how){

  I.card=I.card||S.card||cfg().cartoes[0]?.id;
  const tt=I.totalDetect!=null?I.totalDetect:detectTotal(I.text||'');
  const md=I.mesDetect||detectVencimento(I.text||'')||vencPertoDoTotal(I.text||'',tt); I.mesAuto=!!md; const est=md?null:vencPelasCompras(rows); I.mesEstimado=!!est;

function reconc(){

async function doImport(){

    const C=clone(cfg()); let cch=false;

    const novosP=[...new Set(R.novo.filter(r=>r.on).map(r=>r.quem).filter(q=>q&&!C.pessoas.includes(q)))]; if(novosP.length){C.pessoas.push(...novosP);cch=true}

    for(const m of R.ok){ const u=getU(m.e.id); u.conferido=Object.assign({},u.conferido,{[M]:true}); if(m.e.origem==='planilha'&&m.r.k&&m.r.n){ u.mesRef=M; u.parcRef=m.r.k; u.nTotal=m.r.n; u.origem='conferido'; } if(!u.data&&m.r.data) u.data=m.r.data; }

async function readBackupText(txt){
  if(txt.length>40e6) throw new Error('grande');
  const j=JSON.parse(txt);
  if(j&&j.formato==='cifrado'){ if(!crypto?.subtle) throw new Error('criptografia indisponível'); S.restore={cifrado:true,box:j,exportado:sStr(j.exportado,30)}; }
  else S.restore=sanitizeBackup(j);
  S.openSet='backup'; render();
}
async function applyRestore(R){
  if(R.config) await saveCfg(normCfg(R.config));
  await putMany('lanc',R.lanc.map(x=>[x.id,strip(x)]));
  await putMany('compras',R.compras.map(x=>[x.id,strip(x)]));
  if(Object.keys(R.historico||{}).length) await put('historico','resumo',{meses:Object.assign({},S.hist,R.historico)});
  if(Object.keys(R.conferencias||{}).length) await putMany('conferencias',Object.entries(R.conferencias));
  if(Object.keys(R.pagos||{}).length) await putMany('pagos',Object.entries(R.pagos));
  if((R.ativos||[]).length) await putMany('ativos',R.ativos.map(a=>[a.id,strip(a)]));

const bioAvail=()=>location.protocol==='https:'&&!!window.PublicKeyCredential&&!!navigator.credentials?.create;
async function prfKek(out){ const hk=await crypto.subtle.importKey('raw',out,'HKDF',false,['deriveKey']); return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(0),info:tenc.encode('chave-biometria')},hk,{name:'AES-GCM',length:256},false,['wrapKey','unwrapKey']); }
async function bioPrf(rawId,saltB){
  const a=await navigator.credentials.get({publicKey:{challenge:rand(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:rawId}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:saltB}}}}});
  const r=a.getClientExtensionResults(); if(!r.prf||!r.prf.results||!r.prf.results.first) throw new Error('A digital não devolveu a chave de segurança.'); return r.prf.results.first;
}
async function bioSetup(){
  const A=authRec(); const saltB=rand(32);
  const cred=await navigator.credentials.create({publicKey:{rp:{name:'Saldo Certo',id:location.hostname},user:{id:rand(16),name:A.user,displayName:A.user},challenge:rand(32),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,extensions:{prf:{eval:{first:saltB}}}}});
  const ext=cred.getClientExtensionResults();
  if(!ext.prf||ext.prf.enabled===false) throw new Error('Este celular não oferece a chave segura para a digital. Continue usando a senha.');
  const out=(ext.prf.results&&ext.prf.results.first)||await bioPrf(cred.rawId,saltB);
  A.bio={credId:b64(cred.rawId),saltB:b64(saltB),wrapB:await wrapDek(await prfKek(out),cryptoKey)}; saveAuth(A);
}
async function bioLogin(){
  const A=authRec(); if(!A?.bio) return;
  gateBusy(true);
  try{ const out=await bioPrf(unb64(A.bio.credId),unb64(A.bio.saltB)); cryptoKey=await unwrapDek(await prfKek(out),A.bio.wrapB); gateBusy(false); await unlockData(); }
  catch(e){ gateBusy(false); gateErr(e?.name==='NotAllowedError'?'Digital cancelada. Tente de novo ou use a senha.':'Não deu para entrar com a digital: '+(e.message||e)); }
}

async function gateLogin(user,pw){
  let A=authRec()||{}; user=String(user||'').trim().toLowerCase();
  if(A.bloqAte>Date.now()) { renderGate(); return; }
  gateBusy(true);
  let ok=false, key=null;
  try{
    if(!A.salt){ ok=user===DEF_USER&&pw===DEF_PW; }
    else { const d=await deriveAll(pw,unb64(A.salt),A.iter||ITER); ok=user===A.user&&eqBytes(d.ver,unb64(A.ver)); if(ok) key=await unwrapDek(d.key,A.wrapP); }
  }catch(e){ ok=false; }
  gateBusy(false);
  if(!ok){ A.falhas=(A.falhas||0)+1; if(A.falhas>=5) A.bloqAte=Date.now()+Math.min(3600e3,30e3*Math.pow(2,A.falhas-5)); saveAuth(A); if(A.bloqAte>Date.now()) { G.msg='Usuário ou senha incorretos.'; renderGate(); } else gateErr('Usuário ou senha incorretos.'); return; }
  A.falhas=0; A.bloqAte=0; saveAuth(A);
  if(!A.salt){ showGate('lgpd'); return; }
  cryptoKey=key; await unlockData();
}

function mostrarAtualizacao(reg){
  if(S._avisoVersao) return; S._avisoVersao=true; const b=document.createElement('div'); b.className='updbar'; b.setAttribute('role','status');
  b.innerHTML='<span>Versão nova do app disponível.</span><button class="btn pri" id="updNow">Atualizar</button><button class="btn ghost" id="updLater" style="color:inherit">Depois</button>'; document.body.appendChild(b);
  b.querySelector('#updNow').onclick=async()=>{ S._querAtualizar=true; await saveQ; (reg.waiting||reg.installing)?.postMessage('atualizar'); setTimeout(()=>location.reload(),3000); };

}

async function boot(){
  applyPrefs(); setTab();
  if(!window.__STANDALONE&&window.claude?.use){
    try{ db=await window.claude.use('db'); }catch(e){ db=null; }
    try{ S.caps.sample=await window.claude.use('sample'); }catch(e){ S.caps.sample=null; }
    try{ S.caps.downloads=await window.claude.use('downloads'); }catch(e){ S.caps.downloads=null; }
    if(S.caps.sample){ try{ S.caps.limits=await S.caps.sample.limits(); }catch(e){ S.caps.limits=null; } }
    if(db){ await initDb(); return; }
  }
  S.mode='local';
  if(!(window.crypto&&crypto.subtle)){ showGate('semcripto'); return; }
  try{ navigator.storage?.persist?.(); }catch(e){}
  if((location.protocol==='https:'||location.hostname==='localhost')&&'serviceWorker' in navigator&&window.__SITE){
    const tinha=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      if(reg.waiting&&tinha) mostrarAtualizacao(reg);
      reg.addEventListener('updatefound',()=>{ const n=reg.installing; n&&n.addEventListener('statechange',()=>{ if(n.state==='installed'&&navigator.serviceWorker.controller) mostrarAtualizacao(reg); }); });
      if(navigator.onLine) reg.update().catch(()=>{}); setInterval(()=>{ if(navigator.onLine) reg.update().catch(()=>{}); },60*60e3);
    }).catch(()=>{});
    let recarregou=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!tinha||recarregou||!S._querAtualizar) return; recarregou=true; location.reload(); });
  }
  showGate('login');
}
boot();
