<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finanças da Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: caderneta de bolso — cabeçalho fixo com o mês, conteúdo em cartões de seção, navegação inferior no celular */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --sunk:#E7ECE8; --ink:#14201A; --muted:#5B6A62; --line:#D8E0DA;
  --accent:#0B6B4E; --accent-ink:#FFFFFF; --accent-soft:#E2F0E9;
  --in:#0B6B4E; --out:#B23F2B; --out-soft:#F8E6E1; --warn:#9A6A12; --warn-soft:#F6EDD9; --third:#4A55A2; --third-soft:#E6E8F6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E5ECE7; --muted:#94A39A; --line:#27332C;
  --accent:#4FC08D; --accent-ink:#06130D; --accent-soft:#16302A;
  --in:#4FC08D; --out:#F08B74; --out-soft:#3A201A; --warn:#E3B45A; --warn-soft:#352A14; --third:#9EA8F0; --third-soft:#232745; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E5ECE7; --muted:#94A39A; --line:#27332C;
  --accent:#4FC08D; --accent-ink:#06130D; --accent-soft:#16302A;
  --in:#4FC08D; --out:#F08B74; --out-soft:#3A201A; --warn:#E3B45A; --warn-soft:#352A14; --third:#9EA8F0; --third-soft:#232745; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num,td.v,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:999px;font-size:1.1rem;color:var(--muted)}
.monthnav button:hover{background:var(--surface);color:var(--ink)}
.monthnav .label{min-width:128px;text-align:center;font-weight:600;font-size:.95rem;text-transform:capitalize}
.monthnav .today{width:auto;padding:0 10px;font-size:.78rem;font-weight:600}
nav.tabs{display:flex;gap:4px}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs svg{width:18px;height:18px}
@media (max-width:820px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px;border-radius:10px}
  main{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
  .brand .full{display:none}
  .monthnav{margin-left:auto}
}
main{padding-block:18px 40px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}

/* sections */
.grid{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sechead .sum{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.83rem}

/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi .v{font-family:var(--display);font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.kpi.in .v{color:var(--in)} .kpi.out .v{color:var(--out)}
.kpi.bal .v.neg{color:var(--out)}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpi.bal{grid-column:1 / -1}.kpi .v{font-size:1.3rem}}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);border-radius:8px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.rows .row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.row .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{grid-column:1;font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .d{grid-column:1;grid-row:1}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;grid-column:2;grid-row:1}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 6px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.row .v2{grid-column:2;font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.grp{margin-top:8px}
.grp > .gh{display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 6px 2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.third{background:var(--third-soft);color:var(--third)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--out-soft);color:var(--out)}
.empty{padding:18px 6px;color:var(--muted);font-size:.9rem}

/* cards list */
.cardrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;border-radius:8px}
.cardrow:first-child{border-top:0}
.cardrow:hover{background:var(--sunk)}
.plastic{width:38px;height:26px;border-radius:5px;background:var(--accent);position:relative;opacity:.9}
.plastic::after{content:"";position:absolute;left:6px;top:8px;width:9px;height:7px;border-radius:2px;background:var(--accent-ink);opacity:.55}
.cardrow .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* buttons & forms */
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--out);border-color:var(--out-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:.95rem;color:var(--ink);font-weight:500;width:100%;min-width:0}
textarea.i{min-height:120px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* fab */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:8;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.7rem;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (max-width:820px){.fab{bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px))}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet .sh{display:flex;align-items:center;gap:10px}
.sheet .sh h2{margin-right:auto}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:999px;font-size:1rem}
.confirm{background:var(--out-soft);border-radius:10px;padding:10px;display:grid;gap:8px}

/* card tab */
.cardpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cardpick button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;min-width:120px}
.cardpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cardpick .n{font-weight:700;font-size:.88rem}
.cardpick .t{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.minis{grid-template-columns:1fr 1fr}}
.mini{background:var(--sunk);border-radius:10px;padding:10px 12px}
.mini .v{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.pbar{height:4px;border-radius:9px;background:var(--line);overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.pbar span{display:block;height:100%;background:var(--accent)}

/* import */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-family:var(--display);font-size:1.2rem;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.86rem;color:var(--muted)}
.step b{display:block;color:var(--ink);font-size:.92rem;margin-bottom:2px}
.rev{display:flex;flex-direction:column;gap:0}
.rv{display:grid;grid-template-columns:28px minmax(0,1fr) 110px;gap:6px 10px;align-items:start;padding:10px 4px;border-top:1px solid var(--line)}
.rv.off{opacity:.55}
.rv .meta{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv input.i,.rv select.i{padding:6px 8px;font-size:.88rem}
.rv .meta select.i{width:auto;max-width:150px}
.rv .pc{width:46px!important;text-align:center}
.rv input[type=checkbox]{width:20px;height:20px;margin-top:6px;accent-color:var(--accent)}
.revbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);padding:12px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:820px){.revbar{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}}
.conf{font-size:.86rem;padding:8px 12px;border-radius:10px}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}

/* plan */
.bud{display:grid;gap:12px}
.bud .b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.bud .track{grid-column:1 / -1;height:10px;border-radius:999px;background:var(--sunk);position:relative;overflow:hidden}
.bud .track span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.bud .track span.over{background:var(--out)}
.bud .track i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bin{fill:var(--in)} .chart .bout{fill:var(--out)} .chart .bfix{fill:var(--muted);opacity:.55} .chart .bcard{fill:var(--accent)}
.chart .lin{fill:none;stroke:var(--ink);stroke-width:2}
.chart .dot{fill:var(--ink)}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
table.t td.v{text-align:right}
.tblwrap{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.setlist{display:grid;gap:8px}
.setlist .it{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center}
.setlist .it.two{grid-template-columns:minmax(0,1fr) auto}

/* ===== v2: escala de letra, contraste, login, plano, alertas, conferência ===== */
html{font-size:calc(16px * var(--scale,1))}
body{font-size:.94rem}
html[data-contrast="alto"] body{--muted:var(--ink);--line:color-mix(in srgb,var(--ink) 45%,transparent)}
html[data-contrast="alto"] .chip{outline:1px solid currentColor}
body.locked header.top, body.locked main, body.locked #fab{display:none!important}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gatebox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px}
.gatebox h1{font-size:1.45rem}
.gatebox .mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.btn.big{padding:13px 16px;font-size:1rem;width:100%}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem}
.err{background:var(--out-soft);color:var(--out);border-radius:10px;padding:10px 12px;font-size:.88rem;font-weight:600}
.meter{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}.meter span{display:block;height:100%}
.segtop{margin-bottom:2px}
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.al:first-child{border-top:0}
.al .ic{grid-row:1 / span 2;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.al.bad .ic{background:var(--out-soft);color:var(--out)}
.al.warn .ic{background:var(--warn-soft);color:var(--warn)}
.al.info .ic{background:var(--third-soft);color:var(--third)}
.al.ok .ic{background:var(--accent-soft);color:var(--accent)}
.al b{font-weight:700}
.al .d{font-size:.82rem;color:var(--muted)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:9px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;border-radius:8px}
.catrow:first-child{border-top:0}
button.catrow:hover{background:var(--sunk)}
.catrow .bar{grid-column:1 / -1;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.catrow .bar span{display:block;height:100%;background:var(--accent);opacity:.8}
.catrow .bar span.cut{background:var(--warn)}
.trend{font-size:.75rem;font-weight:700}
.trend.up{color:var(--out)} .trend.down{color:var(--in)}
.pl{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.plh{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.plr{display:grid;grid-template-columns:minmax(0,1fr) 74px 104px;gap:10px;align-items:center}
.plr input[type=range]{width:100%;height:32px;accent-color:var(--accent)}
.plr .pct{text-align:right}
.plr .rs{font-size:.82rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){.plr{grid-template-columns:minmax(0,1fr) 64px}.plr .rs{grid-column:1 / -1;text-align:left}}
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar .btn{border-color:transparent}

<script>
/* ===================== PARSER (puro, testável) ===================== */
const MES_ABR={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function parseBRL(s){ if(s==null) return NaN; s=String(s).replace(/R\$|\s/g,''); let neg=/^-|-$/.test(s); s=s.replace(/^-|-$/g,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); else s=s.replace(/,/g,''); const v=parseFloat(s); return neg?-v:v; }
function normDesc(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/parcela.*$/,'').replace(/[^a-z0-9]+/g,' ').trim()}
function splitParcela(desc){
  let d=desc, k=null, n=null, m;
  const pats=[/\s*[-–(]?\s*(?:parcela|parc\.?|prc)\s*(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\s*\)?/i, /\s+[-–]?\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*$/, /\s(\d{2})\s+DE\s+(\d{2})(?=\s|$)/];
  for(const p of pats){ m=d.match(p); if(m){ const a=+m[1], b=+m[2]; if(a>=1&&b>=2&&a<=b&&b<=72){k=a;n=b;d=(d.slice(0,m.index)+' '+d.slice(m.index+m[0].length)).trim();break;} } }
  d=d.replace(/\s*[-–]\s*$/,'').replace(/\s+BR$/,'').replace(/\s{2,}/g,' ').trim();
  return {desc:d,k,n};
}
const SKIP_RE=/^(total|saldo|subtotal|pagamento m[ií]nimo|valor m[ií]nimo|limite|resumo|fatura anterior|vencimento|melhor dia|taxa|cet|juros do (rotativo|parcelamento)\s*(m[aá]x|ao)|encargos m[aá]x)/i;
const CREDIT_RE=/estorno|cr[eé]dito|devolu|reembolso|cashback|desconto|ajuste a cr/i;
const PAY_RE=/pagamento|pagto|\bpgto\b|pag fatura|inclus[aã]o de pagamento/i;
function parseFaturaText(text){
  const DATE=String.raw`(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{1,2}\s+(?:de\s+)?(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:\s+(?:de\s+)?\d{4})?)`;
  const AMT=String.raw`([-+]\s?)?(?:R\$\s*)?(-\s?)?(\d{1,3}(?:\.\d{3})*,\d{2})(\s?-|\s?[CD](?![\wÀ-ú]))?`;
  const re=new RegExp(`(?:^|\\s)${DATE}\\s+(.+?)\\s+${AMT}(?=\\s|$)`,'gi');
  const out=[];
  // só as páginas com lançamentos: página sem nenhuma linha começando por data (resumo, parcelamento, encargos) é ignorada
  const startRe=new RegExp(`^(?:\\d\\s+)?${DATE}\\s+\\S`,'i');
  let pages=String(text).split('\f'); const comLanc=pages.filter(pg=>pg.split(/\r?\n/).some(l=>startRe.test(l.replace(/\s+/g,' ').trim())));
  if(comLanc.length) pages=comLanc;
  for(const raw of pages.join('\n').split(/\r?\n/)){
    const line=raw.replace(/(^|\s)[-–]\s{2,}(?=(?:R\$|\+|\d))/g,'$1 ').replace(/\b(?:USD|US\$|U\$\$?|EUR|€)\s*\d{1,3}(?:[.,]\d{3})*[.,]\d{2}/gi,' ').replace(/[−–](?=R\$|\d)/g,'-').replace(/\s+/g,' ').trim(); if(!line) continue;
    // encargo sem data (IOF, juros, anuidade) também entra, para a soma bater com o total
    if(!/\d{1,2}\/\d{1,2}|\d{1,2}\s+(?:de\s+)?(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)/i.test(line)&&!/%|^(total|saldo|limite|taxa|cet|valor|pagamento m)/i.test(line)){ const m=line.match(/^((?:repasse de )?iof[^0-9]*|juros[^0-9]*|anuidade[^0-9]*|tarifa[^0-9]*|multa[^0-9]*)\s(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})$/i); if(m){ const v=parseBRL(m[2]); if(v>0) out.push({data:'',desc:m[1].trim(),k:null,n:null,valor:v,tipo:'encargo'}); continue; } }
    re.lastIndex=0; let m;
    while((m=re.exec(line))){
      let [ , dt, desc, s1, s2, amt, suf] = m;
      desc=desc.trim().replace(/^[•*]{2,}\s*\d{4}\s*/,''); if(SKIP_RE.test(desc)||desc.length<2) continue;
      if(/^a(?:t[eé])?\s+\d{1,2}(?:\/\d{1,2}|\s+(?:de\s+)?(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez))/i.test(desc)) continue; // período: a 05 NOV
      if(/^\d+[.,]?\d*$/.test(desc)) continue;
      let v=parseBRL(amt); const neg=!!(s1||s2||(suf&&/[-C]/.test(suf)));
      const sp=splitParcela(desc);
      let tipo='compra';
      if(PAY_RE.test(desc)){ tipo='pagamento'; v=-Math.abs(v); }
      else if(neg||CREDIT_RE.test(desc)){ tipo='estorno'; v=-Math.abs(v); }
      else if(/iof|juros|encargo|anuidade|multa|tarifa|seguro/i.test(desc)) tipo='encargo';
      out.push({data:normData(dt),desc:sp.desc,k:sp.k,n:sp.n,valor:Math.round(v*100)/100,tipo});
    }
  }
  return out;
}
function normData(dt){ dt=String(dt||'').toLowerCase().trim(); let m=dt.match(/^(\d{1,2})\/(\d{1,2})/); if(m) return m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0');
  m=dt.match(/^(\d{1,2})\s+(?:de\s+)?([a-zç]{3})/); if(m&&MES_ABR[m[2]]) return m[1].padStart(2,'0')+'/'+String(MES_ABR[m[2]]).padStart(2,'0'); return dt; }
function detectVencimento(text){
  const T=String(text), cnt={}; let re=/venc(?!er|em|id|ida|ido)[a-zç.]*/gi, mm;
  while((mm=re.exec(T))){ const w=T.slice(mm.index,mm.index+160); const d=w.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{4}|\d{2})(?!\d)/); if(d){ let y=+d[3]; if(y<100) y+=2000; const k=`${y}-${String(+d[2]).padStart(2,'0')}`; if(+d[2]>=1&&+d[2]<=12) cnt[k]=(cnt[k]||0)+1; } }
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; if(best) return best[0];
  const m=T.match(/venc(?!er|em|id)[a-z\.]*(?:imento)?[^0-9]{0,40}(\d{1,2})\s+(?:de\s+)?([a-zç]{3})[a-zç]*\.?\s+(?:de\s+)?(\d{4})/i);
  if(m&&MES_ABR[m[2].toLowerCase()]) return `${m[3]}-${String(MES_ABR[m[2].toLowerCase()]).padStart(2,'0')}`;
  return null;
}
function detectTotal(text){
  const N=String.raw`(\d{1,3}(?:\.\d{3})*,\d{2})`;
  const pats=[String.raw`saldo desta fatura`,String.raw`valor total desta fatura`,String.raw`valor total devido`,String.raw`total desta fatura`,String.raw`fatura atual`,String.raw`fatura (?:de [a-zç]+, )?no valor de`,String.raw`pagamento total`,String.raw`(?<!valor\s)total a pagar`,String.raw`valor (?:total )?da fatura(?!\s+anterior)`,String.raw`total da fatura(?!\s+anterior)`,String.raw`valor desta fatura`];
  const T=String(text), lines=T.split(/\r?\n/), cand=[];
  pats.forEach((p,pi)=>{ const re=new RegExp(p+String.raw`[^0-9\n]{0,25}(?:R\$\s*)?`+N,'i');
    for(const l of lines){ if(/anterior|parcel|m[ií]nimo|limite|pr[oó]xim|simula|valor da transa/i.test(l)) continue; if((l.match(/\d{1,3}(?:\.\d{3})*,\d{2}/g)||[]).length>1&&!/saldo desta|valor total desta/i.test(l)) continue; const m=l.match(re); if(m){ const v=parseBRL(m[1]); if(v>0) cand.push({v,pi,s:m[1]}); } } });
  if(!cand.length) return null;
  const vezes=x=>T.split(x).length-1; // o total costuma aparecer várias vezes na fatura; valores de simulação aparecem uma vez
  cand.sort((a,b)=>(vezes(b.s)-vezes(a.s))||(a.pi-b.pi)); return cand[0].v;
}
// soma das compras do período, quando a fatura informa (serve para conferir quando houve pagamento adiantado)
function detectCompras(text){
  const N=String.raw`(\d{1,3}(?:\.\d{3})*,\d{2})`, T=String(text);
  const pats=[String.raw`total de compras de todos os cart[oõ]es[^R\n]*`,String.raw`total despesas/d[eé]bitos no brasil`,String.raw`despesas at[eé] a emiss[aã]o desta fatura`,String.raw`total dos lan[cç]amentos atuais`];
  for(const p of pats){ const m=T.match(new RegExp(p+String.raw`[^0-9\n]{0,10}(?:R\$\s*)?`+N,'i')); if(m){ let tot=parseBRL(m[1]);
    if(/brasil/.test(p)){ const ex=T.match(new RegExp(String.raw`total despesas/d[eé]bitos no exterior[^0-9\n]{0,10}(?:R\$\s*)?`+N,'i')); if(ex) tot+=parseBRL(ex[1]); }
    return Math.round(tot*100)/100; } }
  return null;
}
// sem data de vencimento no PDF: estima pelo mês da compra mais recente (fatura vence no mês seguinte)
function vencPertoDoTotal(text,total){
  if(!(total>0)) return null; const f=total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  for(const l of String(text).split(/\r?\n/)){ if(!l.includes(f)||/anterior|parcel|m[ií]nimo|limite|melhor/i.test(l)) continue; const d=l.match(/(?:^|\s)(\d{2})\/(\d{2})\/(\d{4})(?!\d)/); if(d&&+d[2]>=1&&+d[2]<=12) return `${d[3]}-${d[2]}`; }
  return null;
}
function vencPelasCompras(rows,hoje){
  hoje=hoje||new Date(); let best=null;
  for(const r of rows||[]){ if(r.tipo==='pagamento'||(r.k&&r.k>1)) continue; const m=String(r.data||'').match(/^(\d{2})\/(\d{2})/); if(!m) continue;
    const mes=+m[2]; let y=hoje.getFullYear(); if(mes>hoje.getMonth()+2) y--; const v=y*12+mes-1; if(best==null||v>best) best=v; }
  if(best==null){ const pg=(rows||[]).filter(r=>r.tipo==='pagamento'); if(pg.length) return vencPelasCompras(pg.map(r=>({...r,tipo:'compra',k:null})),hoje); return null; } best+=1; return `${Math.floor(best/12)}-${String(best%12+1).padStart(2,'0')}`;
}
function parseCSV(text){
  const lines=String(text).split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return [];
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const split=l=>{const r=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){r.push(cur);cur='';}else cur+=ch;}r.push(cur);return r.map(s=>s.trim())};
  const head=split(lines[0]).map(h=>normDesc(h));
  const fi=(...ks)=>head.findIndex(h=>ks.some(k=>h.includes(k)));
  const iD=fi('data','date'), iT=fi('descri','title','lancamento','estabelecimento','historico','memo'), iV=fi('valor','amount','value');
  if(iT<0||iV<0) return [];
  const out=[];
  for(const l of lines.slice(1)){
    const c=split(l); const raw=c[iV]; if(!raw) continue;

const idbGet=(st,k)=>idbReq(st,'readonly',o=>o.get(k)), idbPut=(st,k,v)=>idbReq(st,'readwrite',o=>o.put(v,k)), idbDel=(st,k)=>idbReq(st,'readwrite',o=>o.delete(k)), idbKeys=st=>idbReq(st,'readonly',o=>o.getAllKeys());
let pastaH=null;
const pastaSuportada=()=>typeof window.showDirectoryPicker==='function';
async function gravarNaPasta(dia,txt,pedir){
  let h=pastaH; if(!h){ try{ h=await idbGet('cfg','pasta'); }catch(e){} pastaH=h||null; } if(!h) return 'sem';
  try{ let p=await h.queryPermission({mode:'readwrite'}); if(p!=='granted'&&pedir) p=await h.requestPermission({mode:'readwrite'}); if(p!=='granted') return 'permissao';
    const fh=await h.getFileHandle('saldo-certo-'+dia+'.json',{create:true}); const w=await fh.createWritable(); await w.write(txt); await w.close();
    const nomes=[]; for await (const [n,e] of h.entries()) if(e.kind==='file'&&/^saldo-certo-\d{4}-\d{2}-\d{2}\.json$/.test(n)) nomes.push(n);
    for(const n of nomes.sort().reverse().slice(MAX_COPIAS)) await h.removeEntry(n);
    setPref('pastaDia',dia); return 'ok';
  }catch(e){ return 'erro:'+e.message; }
}
let copiaTimer=null;
async function copiaDiaria(){ // guarda a cópia do dia (atualizada ao longo do dia) e mantém só as 3 mais recentes
  if(S.mode!=='local'||!cryptoKey||!(S.lanc.length||S.compras.length||S.ativos.length)) return;
  try{ await saveQ; const dia=hojeISO(), txt=await backupPayload(); await idbPut('copias',dia,{em:new Date().toISOString(),txt});
    const ks=(await idbKeys('copias')).map(String).sort().reverse(); for(const k of ks.slice(MAX_COPIAS)) await idbDel('copias',k);
    S.copias=ks.slice(0,MAX_COPIAS); setPref('copiaDia',dia);
    if(pastaSuportada()){ const r=await gravarNaPasta(dia,txt,false); S.pastaPend=r==='permissao'; }
  }catch(e){ /* sem IndexedDB: segue sem cópia interna */ }
}
function agendarCopia(){ clearTimeout(copiaTimer); copiaTimer=setTimeout(copiaDiaria,20000); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&cryptoKey){ clearTimeout(copiaTimer); copiaDiaria(); } });
let DV=0; const memo=new Map(); function bump(){DV++;memo.clear()}
function fromLocal(){ S.cfg=local.config.main?normCfg(local.config.main):null; S.lanc=Object.entries(local.lanc).map(([id,v])=>({id,...v})); S.compras=Object.entries(local.compras).map(([id,v])=>({id,...v})); S.hist=(local.historico.resumo||{}).meses||{}; S.conf=local.conferencias||{}; S.pagos=local.pagos||{}; S.ativos=Object.entries(local.ativos||{}).map(([id,v])=>({id,...v})); bump(); }
const SAFE_ID={test:v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,64}$/.test(v)&&!['__proto__','constructor','prototype'].includes(v)};
async function put(col,id,obj){ if(!SAFE_ID.test(id)) throw new Error('id inválido'); if(db) return db.doc(col+'/'+id).set(obj); (local[col]=local[col]||{})[id]=clone(obj); fromLocal(); render(); return persist(); }
function deepMerge(a,b){for(const k of Object.keys(b)){ if(k==='__proto__'||k==='constructor') continue; if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object') deepMerge(a[k],b[k]); else a[k]=b[k];}return a}
async function patch(col,id,obj){ if(db) return db.doc(col+'/'+id).update(obj); local[col][id]=deepMerge(local[col][id]||{},clone(obj)); fromLocal(); render(); return persist(); }
async function del(col,id){ if(db) return db.doc(col+'/'+id).delete(); delete local[col][id]; fromLocal(); render(); return persist(); }
async function putMany(col,items){ if(!db){ local[col]=local[col]||{}; for(const [id,o] of items){ if(SAFE_ID.test(id)) local[col][id]=clone(o); } fromLocal(); render(); return persist(); } for(let i=0;i<items.length;i+=6){ await Promise.all(items.slice(i,i+6).map(([id,o])=>put(col,id,o))); } }
async function delMany(col,ids){ if(!db){ for(const id of ids) delete local[col][id]; fromLocal(); render(); return persist(); } for(const id of ids) await del(col,id); }
const strip=o=>{const c={...o};delete c.id;delete c.k;delete c.antecipada;return c};
async function saveCfg(c){ await put('config','main',c); }

async function initDb(){
  S.mode='db';
  const timer=setTimeout(()=>{ if(!S.got.ok){ S.note='Ainda não consegui acessar os dados salvos. Verifique a conexão; a página continua tentando.'; render(); } },10000);
  const done=k=>{ S.got[k]=true; if(S.got.cfg&&S.got.lanc&&S.got.compras){ S.got.ok=true; S.note=''; clearTimeout(timer);} bump(); render(); };
  const onErr=e=>{ clearTimeout(timer); S.note='Os dados salvos não estão disponíveis agora ('+(e&&e.code||'erro')+').'; render(); };
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?normCfg(s.data()):null; s.metadata.fromCache?(bump(),render()):done('cfg');},onErr);
  db.collection('lanc').onSnapshot(q=>{S.lanc=q.docs.map(d=>({id:d.id,...d.data()})); q.metadata.fromCache?(bump(),render()):done('lanc');},onErr);
  db.collection('compras').onSnapshot(q=>{S.compras=q.docs.map(d=>({id:d.id,...d.data()})); q.metadata.fromCache?(bump(),render()):done('compras');},onErr);
  db.collection('conferencias').onSnapshot(q=>{S.conf=Object.fromEntries(q.docs.map(d=>[d.id,d.data()])); bump(); render();},()=>{});
  db.collection('ativos').onSnapshot(q=>{S.ativos=q.docs.map(d=>({id:d.id,...d.data()})); bump(); render();},()=>{});
  db.collection('pagos').onSnapshot(q=>{S.pagos=Object.fromEntries(q.docs.map(d=>[d.id,d.data()])); render();},()=>{});
  db.doc('historico/resumo').onSnapshot(s=>{S.hist=s.exists?(s.data().meses||{}):{}; bump(); render();},()=>{});
}

/* ===================== cálculos ===================== */
function valorLanc(l,M){
  if(l.recorrente){ if(diffM(l.mes,M)<0) return null; if(l.fim&&diffM(M,l.fim)<0) return null; }
  else if(l.mes!==M) return null;
  if(l.ajustes&&Object.prototype.hasOwnProperty.call(l.ajustes,M)){ const a=l.ajustes[M]; return a==null?null:+a; }
  return +l.valor;
}
const parcNo=(c,M)=>(+c.parcRef||1)+diffM(c.mesRef,M);
function comprasDoMes(M,cartao){
  const out=[];
  for(const c of S.compras){
    if(cartao&&c.cartao!==cartao) continue;
    if(c.recorrente){ if(diffM(c.mesRef,M)>=0&&(!c.fim||diffM(M,c.fim)>=0)&&!(c.pular||{})[M]) out.push({...c,k:1,nTotal:1}); continue; }
    const n=+c.nTotal||1, k=parcNo(c,M), pg=c.pagas||{};
    if(k>=1&&k<=n&&!(pg[k]&&pg[k]!==M)) out.push({...c,k});
    for(const j of Object.keys(pg)) if(pg[j]===M&&+j!==k&&+j>=1&&+j<=n) out.push({...c,k:+j,antecipada:true});
  }
  return out;
}
function restante(x,M){ if(x.recorrente) return x.valor; if(x.antecipada) return x.valor; const n=+x.nTotal||1, pg=x.pagas||{}; let q=0; for(let j=x.k;j<=n;j++) if(!pg[j]||diffM(M,pg[j])>=0) q++; return x.valor*q; }
function calc(M){
  const mk='c'+M; if(memo.has(mk)) return memo.get(mk);
  const ent=[],des=[],inv=[];
  const ehInv=l=>l.tipo==='despesa'&&(l.grupo==='Investimento'||l.grupo==='Amortização');
  for(const l of S.lanc){const v=valorLanc(l,M); if(v==null) continue; (l.tipo==='entrada'?ent:ehInv(l)?inv:des).push({...l,v,previsto:v});}
  // parcelas de financiamentos/empréstimos cadastrados no Patrimônio viram contas fixas do mês
  for(const a of S.ativos){ if(a.classe!=='divida'||!(+a.parcela>0)||!a.refMes||!(+a.nParc>0)) continue; const k=diffM(a.refMes,M); if(k<0||k>=+a.nParc) continue;
    des.push({id:'div_'+a.id,ativoId:a.id,virtual:true,tipo:'despesa',desc:'Parcela '+(a.nome||a.tipo),v:+a.parcela,previsto:+a.parcela,valor:+a.parcela,grupo:'Fixo',cat:'Financiamentos',recorrente:true,mes:a.refMes,dia:+a.dia||0,forma:a.forma||'',restam:+a.nParc-k}); }
  // aportes, resgates e amortizações registrados no Patrimônio
  let aport=0,resg=0,amortMov=0; const movs=[];
  for(const a of S.ativos) for(const m of a.movs||[]) if(m.mes===M){ movs.push({...m,nome:a.nome||a.tipo,ativoId:a.id}); if(m.tipo==='aporte') aport+=+m.valor; else if(m.tipo==='resgate') resg+=+m.valor; else if(m.tipo==='amortizacao') amortMov+=+m.valor; }
  // Fatura do cartão: sempre um valor a pagar (nunca negativo). Crédito maior que as compras fica zerado e avisado.
  const cards=cfg().cartoes.map(c=>{const it=comprasDoMes(M,c.id);const bruto=r2(sum(it,x=>x.valor));const tot=Math.max(0,bruto);const terc=Math.max(0,r2(sum(it.filter(x=>x.quem),x=>x.valor))); const tercP={}; for(const x of it) if(x.quem) tercP[x.quem]=r2((tercP[x.quem]||0)+x.valor);
    return {...c,itens:it,total:tot,credito:bruto<0?-bruto:0,terc,tercP,nosso:r2(Math.max(0,tot-sum(Object.values(tercP),v=>v))),resta:Math.max(0,sum(it,x=>restante(x,M))),conf:S.conf[c.id+'_'+M]||null,abat:0,abatItens:[]}});
  for(const k of cards){ k.adiantado=k.conf&&!k.conf.previsao?Math.min(k.total,+k.conf.adiantado||0):0; k.aPagar=r2(Math.max(0,k.total-k.adiantado)); }
  // Conta fixa paga no cartão (ex.: escola): o valor cadastrado é o real e entra em Contas fixas.
  // Quando a fatura daquele mês é conferida, a cobrança já está nela: o app abate o valor fixo do total do cartão para não contar duas vezes.
  // Conta fixa paga no cartão = ESTIMATIVA para controle. O cartão comanda:
  // durante o mês, o que já foi gasto no cartão (compras ligadas pela categoria ou escolhidas) sai da estimativa;
  // depois que a fatura é conferida, a estimativa zera e vale só o que veio na fatura.
  const fixC=des.filter(d=>d.tipo==='despesa'&&d.cartao); const usadoF=new Set();
  for(const d of fixC){ const card=cards.find(k=>k.id===d.cartao); if(!card){ d.cartao=''; continue; } d.cardNome=card.nome; d.conferida=!!(card.conf&&!card.conf.previsao); d.ligadas=[]; }
  for(const pass of [1,2]) for(const d of fixC){ if(!d.cardNome) continue; const card=cards.find(k=>k.id===d.cartao);
    for(const x of card.itens){ const key=x.id+'_'+x.k; if(x.quem||usadoF.has(key)||x.fixo==='-') continue;
      if(pass===1?x.fixo===d.id:(!x.fixo&&catOf(x)===catOf(d))){ usadoF.add(key); d.ligadas.push(x); x.fixoDe=d.desc; x.fixoId=d.id; } } }
  for(const d of fixC){ if(!d.cardNome) continue; const card=cards.find(k=>k.id===d.cartao); d.lig=r2(sum(d.ligadas,x=>x.valor)); d.estimado=d.v;
    d.v=d.conferida?0:r2(Math.max(0,d.estimado-d.lig)); d.restante=d.v;
    card.abatItens.push({id:d.id,desc:d.desc,fixo:d.estimado,lig:d.lig,resta:d.v,conferida:d.conferida,cat:catOf(d),grupo:grpOf(d)}); }
  const pg0=S.pagos[M]||{}; for(const k of cards){ k.naoPago=r2(sum(Object.entries(k.tercP).filter(([p,v])=>pg0[tercKey('tn_',p)]&&v>0),([p,v])=>v)); k.conta=r2(k.nosso+k.naoPago); k.fixTotal=r2(sum(k.abatItens,a=>a.fixo)); k.fixResta=r2(sum(k.abatItens,a=>a.resta)); }
  const terceiros={}, tercInfo={}; for(const c of cards) for(const [p,v] of Object.entries(c.tercP)){ terceiros[p]=r2((terceiros[p]||0)+v); const t=tercInfo[p]=tercInfo[p]||{v:0,cards:[],vencido:true}; t.v=terceiros[p]; t.cards.push(c.id); if(!vencPassou(M,c)) t.vencido=false; }
  for(const [p,t] of Object.entries(tercInfo)){ t.naoPagou=!!pg0[tercKey('tn_',p)]; t.pagou=!!pg0[tercKey('tp_',p)]; }
  const pgM=S.pagos[M]||{}; const late=p=>p&&typeof p==='object'&&YM.test(p.em||'')&&p.em!==M;
  for(const d of des){ const p=pgM['l_'+d.id]; if(late(p)) d.movido=p; }
  for(const k of cards){ const p=pgM['c_'+k.id]; if(late(p)) k.movido=p; }
  for(const d of des){ if(!d.cartao||d.movido) continue; const k=cards.find(x=>x.id===d.cartao); if(k&&k.movido) d.movido=k.movido; } // fatura paga com atraso leva junto a conta fixa que está nela
  const atras=[]; // contas de meses anteriores pagas neste mês
  for(const pm of Object.keys(S.pagos)){ if(!YM.test(pm)||diffM(pm,M)<=0) continue;
    for(const [key,p] of Object.entries(S.pagos[pm]||{})){ if(!p||typeof p!=='object'||p.em!==M) continue; const c0=calc(pm); let nome='',orig=0,outros=0;
      if(key.startsWith('c_')){ const k=c0.cards.find(x=>x.id===key.slice(2)); if(k){ nome='Fatura '+k.nome; orig=k.conta; outros=r2(k.total-k.conta); } }
      else { const d=c0.des.find(x=>'l_'+x.id===key); if(d){ nome=d.desc; orig=d.previsto??d.v; } }
      if(nome) atras.push({key,mes:pm,nome,orig:r2(orig),valor:r2(+p.valor?Math.max(0,+p.valor-outros):orig)}); } }
  const totEnt=sum(ent,x=>x.v), totReemb=0; // contas dos outros não entram nas suas entradas
  const totDes=sum(des.filter(d=>!d.movido),x=>x.v), totCard=sum(cards.filter(k=>!k.movido),c=>c.conta), totAtras=r2(sum(atras,a=>a.valor)), totMovido=r2(sum(des.filter(d=>d.movido),x=>x.v)+sum(cards.filter(k=>k.movido),c=>c.conta));
  const totInv=r2(sum(inv.filter(x=>x.grupo==='Investimento'),x=>x.v)+aport-resg), totAmort=r2(sum(inv.filter(x=>x.grupo==='Amortização'),x=>x.v)+amortMov);
  const r={ent,des,inv,movs,cards,terceiros,tercInfo,atras,totEnt,totReemb,totDes,totCard,totAtras,totMovido,totInv,totAmort,aport,resg,saldo:r2(totEnt+totReemb-totDes-totCard-totAtras-totInv-totAmort)};
  memo.set(mk,r); return r;
}
function gastos(M){
  const mk='g'+M; if(memo.has(mk)) return memo.get(mk);
  const c=calc(M), items=[];
  for(const d of c.des) if(!d.movido&&(d.v>0||!d.cardNome)) items.push({desc:d.cardNome?d.desc+' (estimativa no cartão '+d.cardNome+', ainda não gasto)':d.desc,valor:d.v,grupo:grpOf(d),cat:catOf(d),src:'lanc',id:d.id,fixo:!!d.recorrente});
  for(const k of c.cards){ if(k.movido) continue; for(const x of k.itens) if(!x.quem||(c.tercInfo[x.quem]&&c.tercInfo[x.quem].naoPagou&&(k.tercP[x.quem]||0)>0)) items.push({desc:x.quem?x.desc+' ('+x.quem+' não pagou)':x.desc,valor:x.valor,grupo:grpOf(x),cat:catOf(x),src:'compra',id:x.id,cartao:k.nome,k:x.k,n:x.nTotal});
  }
  for(const a of c.atras) if(a.valor>a.orig+0.005) items.push({desc:'Juros e multa por atraso: '+a.nome+' ('+MESES[+a.mes.slice(5)-1]+')',valor:r2(a.valor-a.orig),grupo:catInfo('Juros e tarifas').grupo,cat:'Juros e tarifas',src:'atraso'});
  const porCat={},porGrupo={}; for(const i of items){ porCat[i.cat]=(porCat[i.cat]||0)+i.valor; const g=i.grupo||'Sem grupo'; porGrupo[g]=(porGrupo[g]||0)+i.valor; }
  const r={c,items,porCat,porGrupo,total:sum(items,i=>i.valor)}; memo.set(mk,r); return r;
}
function plano(M){
  const g=gastos(M), base=g.c.totEnt;
  const gs=cfg().grupos.map(x=>({...x,meta:+x.meta||0,lim:base*(+x.meta||0)/100,real:g.porGrupo[x.nome]||0}));
  for(const k of Object.keys(g.porGrupo)) if(!gs.some(x=>x.nome===k)) gs.push({nome:k,meta:null,lim:0,real:g.porGrupo[k]});
  const poup=gs.filter(x=>x.poupanca);
  const c=g.c; for(const x of gs){ if(x.nome==='Investimento') x.real=Math.max(0,c.totInv); if(x.nome==='Amortização') x.real=c.totAmort; }
  return {g,base,gs,poupMeta:sum(poup,x=>x.lim),poupReal:Math.max(0,c.totInv)+c.totAmort,inv:c.totInv,am:c.totAmort};
}
function hasData(M){ const c=calc(M); return c.ent.length+c.des.length+sum(c.cards,k=>k.itens.length)>0 }
function mediaCats(M,n){ const acc={}; let q=0; const first=firstDataMonth(); for(let i=1;i<=n;i++){ const m=addM(M,-i); if(!first||diffM(first,m)<0||!hasData(m)) continue; q++; for(const [c,v] of Object.entries(gastos(m).porCat)) acc[c]=(acc[c]||0)+v; } if(!q) return {}; for(const c in acc) acc[c]/=q; return acc; }
function firstDataMonth(){const ms=[...S.lanc.map(l=>l.mes),...S.compras.map(c=>c.mesRef)].filter(Boolean).sort();return ms[0]||null}
function tercKey(pre,p){ return pre+(normDesc(p).replace(/ /g,'_').slice(0,40)||'x'); }
function vencPassou(M,k){ const now=ymNow(); if(diffM(M,now)>0) return true; if(M!==now) return false; return new Date().getDate()>(+k.venc||+cfg().diaPagamento||10); }
function passouPagamento(M){ const now=ymNow(); if(diffM(M,now)>0) return true; if(M!==now) return false; return new Date().getDate()>(+cfg().diaPagamento||10); }

/* ---------- reserva de emergência ---------- */
function reserva(M){
  const R=cfg().reserva||{meses:6,atual:0,desde:null}, now=ymNow(), ate=diffM(now,M)>0?now:M;
  const first=R.desde||firstDataMonth(); let ap=0;
  if(first) for(let m=R.desde?addM(R.desde,1):first; diffM(m,ate)>=0; m=addM(m,1)) ap+=sum(calc(m).inv.filter(x=>catOf(x)==='Reserva de emergência'),x=>x.v);
  const ms=[]; for(let i=0;i<6&&ms.length<3;i++){ const m=addM(ate,-i); if(hasData(m)){ const g=gastos(m); ms.push(g.total); } }
  const resAt=S.ativos.filter(a=>a.classe==='invest'&&a.objetivo==='Reserva de emergência');
  const custo=ms.length?sum(ms)/ms.length:0, meta=custo*(+R.meses||6), atual=resAt.length?sum(resAt,a=>valAtivo(a,ate)):(+R.atual||0)+ap;
  const aportes=[]; for(let i=0;i<3;i++){ const c=calc(addM(ate,-i)); aportes.push(sum(c.inv.filter(x=>catOf(x)==='Reserva de emergência'),x=>x.v)+sum(c.movs.filter(m=>m.tipo==='aporte'&&S.ativos.find(a=>a.id===m.ativoId)?.objetivo==='Reserva de emergência'),m=>m.valor)); } const ritmo=sum(aportes)/3;
  const falta=Math.max(0,meta-atual);
  return {custo,meta,atual,falta,meses:+R.meses||6,cobre:custo?atual/custo:0,ritmo,prazo:ritmo>0?Math.ceil(falta/ritmo):null};
}
function reservaCard(M){
  const r=reserva(M); if(!r.custo&&!r.atual) return '';
  const p=r.meta?Math.min(100,r.atual/r.meta*100):0;
  return `<section class="card grid"><div class="sechead"><h2>Reserva de emergência</h2><span class="small muted">meta: ${r.meses} meses de gastos</span></div>
    <div class="bud"><div class="b"><span><b>${brl(r.atual)}</b> <span class="small muted">de ${brl(r.meta)}</span></span><span class="num" style="font-weight:700">${Math.round(p)}%</span><div class="track"><span style="width:${p}%"></span></div></div></div>
    <p class="small" style="margin:0">Cobre ${r.cobre.toLocaleString('pt-BR',{maximumFractionDigits:1})} ${r.cobre>=1&&r.cobre<2?'mês':'meses'} dos seus gastos (média de ${brl(r.custo)} por mês).${r.falta>0?(r.prazo?` No ritmo atual (${brl(r.ritmo)} por mês) você chega à meta em ${r.prazo} ${r.prazo===1?'mês':'meses'}.`:` Faltam ${brl(r.falta)}. Lance os aportes na categoria "Reserva de emergência".`):' Meta atingida.'}</p>
  </section>`;
}

const AVISO_NOMES='Só um apelido para organizar. O app não pede nem guarda número, validade, código de segurança, agência, conta ou senha.';

  bem:['Imóvel','Veículo','Terreno','Outro bem'],divida:['Financiamento imobiliário','Financiamento de veículo','Empréstimo consignado','Empréstimo pessoal','Cheque especial','Outra dívida']};
const INSTS=['Nubank','Inter','Itaú','Bradesco','Banco do Brasil','Caixa','Santander','C6 Bank','PicPay','Mercado Pago','BTG Pactual','XP Investimentos','Rico','Clear','NuInvest','Banco Pan','Sicredi','Sicoob','Tesouro Direto','Binance'];

const CLASSE_N={invest:'Investimentos',bem:'Bens',divida:'Dívidas'};
function restParc(a,M){ return a.refMes&&+a.nParc?Math.max(0,+a.nParc-diffM(a.refMes,M)):0; }
function valAtivo(a,M){ if(a.classe==='divida'&&a.estimar) return r2((+a.parcela||0)*restParc(a,M)); const ks=Object.keys(a.hist||{}).filter(k=>diffM(k,M)>=0).sort(); if(ks.length) return +a.hist[ks[ks.length-1]]||0; const c=Object.keys(a.hist||{}).sort()[0]; return !c||diffM(c,M)>=0?+a.atual||0:0; }
function patri(M){ let inv=0,bem=0,div=0; for(const a of S.ativos){ const v=valAtivo(a,M); if(a.classe==='invest') inv+=v; else if(a.classe==='bem') bem+=v; else div+=v; } return {inv,bem,div,liq:inv+bem-div}; }
const hasInv=()=>S.ativos.some(a=>a.classe==='invest');

    <div class="grid" style="gap:8px"><button class="btn pri big" data-act="ativonovo" data-c="invest">Cadastrar um investimento</button><button class="btn big" data-act="ativonovo" data-c="bem">Cadastrar um bem ou dívida</button></div></section>`;

  let chart='';
  if(ms.length>=2){ const d=ms.map(m=>({m,...patri(m)})); const W=760,H=220,Pd={l:52,r:12,t:12,b:28}; const mx=niceMax(Math.max(1,...d.map(x=>Math.max(x.inv+x.bem,x.liq)))); const bw=(W-Pd.l-Pd.r)/d.length, y=v=>H-Pd.b-(H-Pd.t-Pd.b)*Math.max(0,v)/mx;
    let g=svgAxis(W,H,Pd,mx); d.forEach((x,i)=>{const x0=Pd.l+i*bw+bw*.2,w=bw*.6; g+=`<rect class="bcard" x="${x0}" y="${y(x.inv)}" width="${w}" height="${H-Pd.b-y(x.inv)}"><title>${mLabel(x.m)}: investimentos ${brl(x.inv)}</title></rect><text x="${Pd.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${mShort(x.m)}</text>`});
    g+=`<polyline class="linacc" points="${d.map((x,i)=>`${Pd.l+i*bw+bw/2},${y(x.liq)}`).join(' ')}"/>`+d.map((x,i)=>`<circle class="dotacc" cx="${Pd.l+i*bw+bw/2}" cy="${y(x.liq)}" r="3"><title>Patrimônio líquido ${brl(x.liq)}</title></circle>`).join('');
    chart=`<section class="card grid"><div class="sechead"><h2>Evolução</h2></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do patrimônio">${g}</svg></div><div class="legend"><span><i style="background:var(--accent)"></i>Investimentos</span><span><i style="background:var(--third)"></i>Patrimônio líquido</span></div></section>`; }
  const pv=S.patView||'tipo'; const grp={}; for(const a of inv){ const k=pv==='inst'?(a.inst||'Sem instituição'):pv==='obj'?(a.objetivo||'Sem objetivo'):(a.tipo||'Outro'); grp[k]=(grp[k]||0)+valAtivo(a,now); }

    <div class="kpi out"><div class="eyebrow">Dívidas a pagar</div><div class="v">${brl(P.div)}</div><div class="small muted">${divs.length?'saldo devedor total':'nenhuma cadastrada'}</div></div>
  </div>
  ${P.div?`<div class="stack" aria-hidden="true"><span style="width:${Math.min(100,P.liq>0?P.liq/(P.inv+P.bem)*100:0)}%;background:var(--in)"></span><span style="width:${Math.min(100,P.div/Math.max(1,P.inv+P.bem)*100)}%;background:var(--out)"></span></div><div class="legend"><span><i style="background:var(--in)"></i>É seu de verdade</span><span><i style="background:var(--out)"></i>Ainda é do banco</span></div>`:''}

  <div class="btnrow"><button class="btn pri" data-act="movnovo">Aporte ou resgate</button><button class="btn" data-act="saldos">Atualizar saldos</button><button class="btn" data-act="ativonovo" data-c="invest">+ Investimento</button><button class="btn" data-act="ativonovo" data-c="bem">+ Bem ou dívida</button></div>
  <div class="cols"><div class="grid">
    ${inv.length?`<section class="card"><div class="sechead"><h2>Investimentos</h2><span class="sum">${brl(P.inv)}</span></div><div class="rows">${inv.sort((a,b)=>valAtivo(b,now)-valAtivo(a,now)).map(rowA).join('')}</div></section>`:''}
    ${bens.length||divs.length?`<section class="card"><div class="sechead"><h2>Bens e dívidas</h2><span class="sum">${brl(P.bem-P.div)}</span></div><div class="rows">${[...bens,...divs].map(rowA).join('')}</div></section>`:''}
  </div><div class="grid">
    ${gl.length?`<section class="card grid"><div class="sechead"><h2>Onde está o dinheiro</h2></div>
      <div class="seg">${[['tipo','Tipo'],['inst','Instituição'],['obj','Objetivo']].map(([k,l])=>`<button data-act="patview" data-v="${k}" aria-pressed="${pv===k}">${l}</button>`).join('')}</div>
      <div class="rows">${gl.map(([k,v])=>`<div class="catrow"><span><b>${esc(k)}</b> <span class="small muted">${P.inv?Math.round(v/P.inv*100):0}%</span></span><span class="num" style="font-weight:700">${brl(v)}</span><span class="bar"><span style="width:${v/mx*100}%"></span></span></div>`).join('')}</div></section>`:''}
    ${chart}
  </div></div>
  <p class="small muted" style="margin:0">Atualize os saldos uma vez por mês (o app do banco mostra o valor atual). Assim a evolução fica certa.</p></div>`;

/* ---------- calendário de vencimentos ---------- */
function vencimentos(M){
  const c=calc(M), out=[], pg=S.pagos[M]||{}, now=ymNow(), hoje=new Date().getDate();
  for(const k of c.cards) if(k.aPagar>0) out.push({key:'c_'+k.id,dia:+k.venc||0,nome:'Fatura '+k.nome,valor:k.aPagar,tipo:'cartao',forma:'Fatura'});
  for(const d of c.des) if(!d.cartao&&d.v>0) out.push({key:'l_'+d.id,dia:+d.dia||0,nome:d.desc,valor:d.v,tipo:'conta',forma:FORMAS[d.forma]||''});
  for(const v of out){ const p=pg[v.key]; v.pago=!!p; v.pagoEm=p&&typeof p==='object'?p:null;
    if(v.pago) v.st='pago'; else if(!v.dia) v.st=diffM(M,now)>0?'atrasado':'semdia'; else if(diffM(M,now)>0||(M===now&&v.dia<hoje)) v.st='atrasado'; else if(M===now&&v.dia-hoje<=3) v.st='breve'; else v.st='futuro';
    v.falta=M===now&&v.dia?v.dia-hoje:null; }
  return out.sort((a,b)=>(a.dia||99)-(b.dia||99)||b.valor-a.valor);
}
function atrasadasAte(M){ // contas de meses anteriores que ficaram sem pagar
  const out=[]; // só a partir do primeiro mês em que a pessoa usou o checklist (evita "atrasadas" vindas do histórico importado)
  const first=Object.keys(S.pagos).filter(k=>YM.test(k)&&Object.keys(S.pagos[k]||{}).some(x=>x!=='ok_falta')).sort()[0]; if(!first) return out;
  for(let i=1;i<=6;i++){ const pm=addM(M,-i); if(diffM(first,pm)<0) break; for(const v of vencimentos(pm)) if(!v.pago) out.push({...v,mes:pm}); }
  return out;
}
function vencCard(M){
  const at=diffM(M,ymNow())>=0?atrasadasAte(M):[];
  const all=vencimentos(M); if(!all.length&&!at.length) return '';
  const pagas=all.filter(v=>v.pago), pend=all.filter(v=>!v.pago), falta=sum(pend,v=>v.valor);
  const jp=S.justPaid||new Set(); const vs=S.ckAll?[...pend,...pagas]:[...pend.slice(0,5),...pagas.filter(v=>jp.has(v.key))];
  const chip={pago:'',atrasado:'<span class="chip bad">atrasada</span>',breve:'',futuro:'',semdia:''};
  return `<section class="card"><div class="sechead"><h2>Contas do mês</h2><span class="small muted">${pagas.length} de ${all.length} pagas${falta?' · falta '+brl(falta):''}</span></div>
    ${all.length?`<div class="stack" style="height:8px;margin-bottom:6px" aria-hidden="true"><span style="width:${pagas.length/all.length*100}%;background:var(--in)"></span></div>`:''}

function alertas(M){
  const out=[], P=plano(M), c=P.g.c, base=P.base;
  { const t=metaTotal(cfg()); if(Math.abs(t-100)>=0.05) out.push({n:'warn',t:`Seu plano soma ${String(t).replace('.',',')}%, e não 100%`,d:'Ajuste em Ajustes → Seu plano para os limites fazerem sentido.'}); }
  if(!base) out.push({n:'warn',t:'Nenhuma entrada lançada neste mês',d:'Cadastre o salário em Ajustes → Salário e contas fixas. O plano usa as entradas como base.'});
  if(c.saldo<0) out.push({n:'bad',t:`O mês fecha negativo: ${brl(c.saldo)}`,d:'As saídas estão maiores que as entradas.'});
  for(const x of P.gs){ if(x.poupanca||!x.lim) continue; const p=x.real/x.lim;
    if(p>1.005) out.push({n:'bad',t:`${x.nome} passou do limite em ${brl(x.real-x.lim)}`,d:`Gasto de ${brl(x.real)} para um limite de ${brl(x.lim)} (${x.meta}% das entradas).`,grupo:x.nome});
    else if(p>0.9) out.push({n:'warn',t:`${x.nome} perto do limite`,d:`${Math.round(p*100)}% do limite já usado.`,grupo:x.nome}); }
  if(P.poupMeta>0&&P.poupReal+0.5<P.poupMeta){ out.push({n:P.poupReal?'warn':'info',t:`Investido ${brl(P.poupReal)} de ${brl(P.poupMeta)} planejados`,d:(P.am?`Inclui ${brl(P.am)} de amortização. `:'')+(c.saldo>0?`Ainda há ${brl(c.saldo)} para destinar neste mês.`:'A meta é um guia: compense nos próximos meses.'),pat:true}); }
  for(let k=1;k<=3;k++){ const m=addM(M,k), s=calc(m).saldo; if(s<0){ out.push({n:'warn',t:`${cap(mLabel(m))} pode fechar negativo (${brl(s)})`,d:'Contando salário, contas fixas e parcelas já previstas.'}); break; } }
  const nx=calc(addM(M,1)), parc=sum(nx.cards,k=>k.nosso);
  if(base&&parc/base>0.3) out.push({n:'warn',t:`Cartões do próximo mês já somam ${Math.round(parc/base*100)}% das entradas`,d:`${brl(parc)} previstos nas faturas de ${mLabel(addM(M,1))}.`});
  for(const k of c.cards){ for(const a of k.abatItens) if(a.lig>a.fixo+0.5) out.push({n:'warn',t:`${a.desc}: ${brl(a.lig)} no cartão ${k.nome}, ${brl(a.lig-a.fixo)} acima da estimativa`,d:`A estimativa era ${brl(a.fixo)} por mês.`,cat:a.cat});
    if(k.credito>0.005) out.push({n:'info',t:`Fatura ${k.nome} com crédito de ${brl(k.credito)}`,d:'Os créditos passaram das compras. A fatura fica R$ 0,00; confira no app do banco.',card:k.id}); }
  const avg=mediaCats(M,3);
  for(const [cat,v] of Object.entries(P.g.porCat)){ const a=avg[cat]||0; if(catInfo(cat).corte&&a>50&&v>a*1.25&&v-a>80) out.push({n:'warn',t:`${cat} subiu ${Math.round((v/a-1)*100)}%`,d:`${brl(v)} neste mês. A média dos 3 meses anteriores foi ${brl(a)}.`,cat}); }
  const juros=P.g.porCat['Juros e tarifas']||0; if(juros>0) out.push({n:'bad',t:`${brl(juros)} em juros, IOF ou tarifas`,d:'É dinheiro que não volta. Veja se dá para negociar a anuidade ou evitar atrasos.',cat:'Juros e tarifas'});
  for(const k of c.cards){
    if(k.conf){ const p=k.conf.pendencias||0; if(p) out.push({n:'warn',t:`Fatura ${k.nome}: ${p} ${p>1?'pendências':'pendência'} na conferência`,d:k.conf.resumo||'',card:k.id}); else if(Math.abs(k.conf.diferenca||0)>0.05) out.push({n:'warn',t:`Fatura ${k.nome} não bate: diferença de ${brl(k.conf.diferenca)}`,d:'Total do PDF diferente da soma dos lançamentos.',card:k.id}); }
    else if(passouPagamento(M)&&k.itens.length) out.push({n:'info',t:`Fatura ${k.nome} ainda não conferida`,d:`Previsto ${brl(k.total)}. Importe o PDF em "Conferir fatura" para validar.`,card:k.id});
  }
  if(diffM(M,ymNow())>=0){ const at=atrasadasAte(M); if(at.length) out.push({n:'bad',t:`${at.length} ${at.length>1?'contas atrasadas':'conta atrasada'} de meses anteriores: ${brl(sum(at,v=>v.valor))}`,d:'Quando pagar, marque em Contas do mês e informe o valor com juros. Ele sai do mês em que você pagou.'}); }
  for(const v of vencimentos(M)){ if(v.st==='atrasado') out.push({n:'bad',t:`${v.nome} venceu no dia ${v.dia} e não está marcada como paga`,d:`${brl(v.valor)}. Se já pagou, marque como paga em Vencimentos.`}); else if(v.st==='breve') out.push({n:'warn',t:`${v.nome} ${v.falta===0?'vence hoje':v.falta===1?'vence amanhã':'vence em '+v.falta+' dias'}`,d:brl(v.valor)}); }
  if(M===ymNow()){ const rv=reserva(M); if(rv.custo&&rv.cobre<3) out.push({n:'info',t:`Reserva de emergência cobre ${rv.cobre.toLocaleString('pt-BR',{maximumFractionDigits:1})} meses de gastos`,d:`A meta é ${rv.meses} meses (${brl(rv.meta)}). Faltam ${brl(rv.falta)}.`}); }
  const semResp=Object.entries(c.tercInfo||{}).filter(([p,t])=>t.vencido&&t.v>0.009&&!t.pagou&&!t.naoPagou); if(semResp.length&&diffM(M,ymNow())<=1) out.push({n:'info',t:`Os outros pagaram a parte deles? ${semResp.map(([p,t])=>p+' '+brl(t.v)).join(' · ')}`,d:'Responda em Contas dos outros. Sem resposta, o app considera pago.'});
  const ord={bad:0,warn:1,info:2}; return out.sort((a,b)=>ord[a.n]-ord[b.n]);
}
function cortes(M){
  const P=plano(M), avg=mediaCats(M,3);
  const list=Object.entries(P.g.porCat).filter(([c,v])=>catInfo(c).corte&&v>0).map(([cat,v])=>({cat,v,avg:avg[cat]||0,eco:v*0.3})).sort((a,b)=>b.v-a.v);
  const acima=sum(P.gs.filter(x=>!x.poupanca&&x.lim&&x.real>x.lim),x=>x.real-x.lim);
  const falta=Math.max(0,P.poupMeta-P.poupReal);
  const assin=P.g.items.filter(i=>i.cat==='Streaming e assinaturas');
  return {list,acima,falta,eco:sum(list,x=>x.eco),assin};
}

function anual(Y){
  const ms=Array.from({length:12},(_,i)=>`${Y}-${String(i+1).padStart(2,'0')}`), now=ymNow(), first=firstDataMonth();
  let acc=+cfg().investInicial||0, accMeta=acc;
  if(first) for(let m=first; diffM(m,ms[0])>0; m=addM(m,1)){ const P=plano(m); acc+=P.inv; accMeta+=P.inv; }
  return ms.map(m=>{
    const fut=diffM(now,m)>0; const app=first&&diffM(first,m)>=0; const h=S.hist[m];
    const P=plano(m), c=P.g.c;
    const e=app?c.totEnt+c.totReemb:(h?h.e:0), s=app?c.totDes+c.totCard:(h?h.s:0);
    if(hasInv()){ if(!fut){ acc=patri(m).inv; accMeta=acc; } else { acc+=P.inv; accMeta+=Math.max(P.inv,P.poupMeta-P.am); } }
    else { acc+=P.inv; accMeta+=fut?Math.max(P.inv,P.poupMeta-P.am):P.inv; }
    return {m,e,s,sobra:e-s,inv:P.inv,am:P.am,meta:P.poupMeta,poup:P.poupReal,fut,acc,accMeta,src:app?'app':(h?'planilha':''),plano:P};
  });
}

function svgAxis(W,H,P,mx,ticks=4){let g='';for(let i=0;i<=ticks;i++){const v=mx*i/ticks,y=H-P.b-(H-P.t-P.b)*i/ticks;g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/><text x="${P.l-6}" y="${y+4}" text-anchor="end">${brlK(v)}</text>`}return g}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=[1,2,2.5,5,10].find(n=>n*p>=v);return n*p}
function chartHist(M){
  const first=firstDataMonth(); const ms=Array.from({length:24},(_,i)=>addM(M,i-23));
  const d=ms.map(m=>{ if(first&&diffM(first,m)>=0){const c=calc(m);return {m,e:c.totEnt+c.totReemb,s:c.totDes+c.totCard,src:'app'}} if(S.hist[m]) return {m,e:S.hist[m].e,s:S.hist[m].s,src:'planilha'}; return {m,e:0,s:0,src:''}});
  const W=760,H=220,P={l:52,r:12,t:12,b:28}; const mx=niceMax(Math.max(...d.map(x=>Math.max(x.e,x.s)),1));
  const bw=(W-P.l-P.r)/ms.length; const y=v=>H-P.b-(H-P.t-P.b)*v/mx; let s=svgAxis(W,H,P,mx);
  d.forEach((x,i)=>{const x0=P.l+i*bw+bw*.12,w=bw*.36;s+=`<rect class="bin" x="${x0}" y="${y(x.e)}" width="${w}" height="${H-P.b-y(x.e)}"><title>${mLabel(x.m)}: entradas ${brl(x.e)}</title></rect><rect class="bout" x="${x0+w+1}" y="${y(x.s)}" width="${w}" height="${H-P.b-y(x.s)}"><title>${mLabel(x.m)}: saídas ${brl(x.s)}</title></rect>`;if(i%3===0)s+=`<text x="${P.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${mShort(x.m)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histórico de entradas e saídas">${s}</svg></div><div class="legend"><span><i style="background:var(--in)"></i>Entradas</span><span><i style="background:var(--out)"></i>Saídas</span></div>`;
}

  const sec=(title,chip,cls,body,n,fechado)=>n?(fechado?`<details class="conf-sec"><summary><h3 style="display:inline-flex">${title} <span class="chip ${cls}">${n}</span></h3></summary>${body}</details>`:`<div class="conf-sec"><h3>${title} <span class="chip ${cls}">${n}</span></h3>${body}</div>`):'';
